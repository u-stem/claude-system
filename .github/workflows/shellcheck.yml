name: shellcheck
on: [push, pull_request]

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

      - name: Run shellcheck (warning level)
        run: |
          # tools/githooks was outside this gate. tools/migrate/ is empty since the
          # 2026-09-23 retirement (ADR 0030); an unmatched glob would fail shellcheck.
          # githooks has no .sh suffix, so no glob reached it — and it holds
          # pre-push, the guard ADR 0024 relies on most.
          shellcheck -S warning \
            tools/*.sh \
            tools/githooks/* \
            tests/*.sh \
            adapters/claude-code/user-level/hooks/*.sh
