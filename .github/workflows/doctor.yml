name: doctor
on:
  push:
    branches: [main]
  pull_request:

jobs:
  doctor:
    # macOS, not Linux. This repository assumes a BSD userland by policy
    # (CLAUDE.md: "macOS BSD コマンド前提、GNU 互換不要"), and two delegated
    # suites depend on it in ways no runner-side fix can paper over:
    # disable/enable-guardrails.sh call cs_require_macos() and exit 1 by design
    # anywhere else, and check-failure-patterns.sh derives its window with
    # `date -v`, which on GNU date leaves the cutoff empty so the hook emits
    # nothing and eight assertions fail. Both were green locally and red here
    # from 2026-08-09, when doctor.sh took over running every suite (ADR 0026).
    # Running the checks on the platform they target is the only reading that
    # keeps the policy and the gate honest.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # The macOS image already carries jq and shellcheck; tree it does not.
      # Install only what is missing so a future image gaining tree costs
      # nothing, and a future image losing jq still works.
      - name: Install tools
        run: |
          for t in tree jq shellcheck; do
            command -v "$t" >/dev/null 2>&1 || brew install "$t"
          done

      - name: Install gitleaks
        env:
          # gh release download authenticates via GITHUB_TOKEN, which avoids
          # the anonymous-rate-limit / occasional HTML-error-page that
          # `curl https://github.com/.../releases/download/...` ran into in
          # the rc1 follow-up CI run on 2026-04-29.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          GITLEAKS_VERSION=8.30.1
          # The runner image moved to Apple silicon; resolve rather than pin so
          # the job survives the next arch change without a red build to explain.
          case "$(uname -m)" in
            arm64) GITLEAKS_ARCH=arm64 ;;
            *)     GITLEAKS_ARCH=x64 ;;
          esac
          gh release download "v${GITLEAKS_VERSION}" \
            -R gitleaks/gitleaks \
            -p "gitleaks_${GITLEAKS_VERSION}_darwin_${GITLEAKS_ARCH}.tar.gz" \
            -O /tmp/gitleaks.tar.gz
          sudo mkdir -p /usr/local/bin
          sudo tar -xz -C /usr/local/bin -f /tmp/gitleaks.tar.gz gitleaks
          gitleaks version

      - name: Run doctor.sh
        env:
          NO_COLOR: "1"
        run: ./tools/doctor.sh

      # doctor.sh already delegates every lint and behaviour test; re-listing
      # them here duplicated the list and gave it a second place to drift.
      # What doctor.sh deliberately does NOT run is the push-guard suite: it
      # costs 2.13s and lives in tools/githooks/pre-push instead (ADR 0024).
      # That hook is repo-local, so until now GitHub never exercised the guard
      # at all — a regression in it would only surface on the operator's
      # machine at push time. This step closes that gap.
      - name: Run guard tests not covered by doctor.sh
        env:
          NO_COLOR: "1"
        run: ./tests/test-pre-bash-guard.sh
